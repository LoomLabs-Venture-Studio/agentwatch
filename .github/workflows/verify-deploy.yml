# Repurposed from the loom-cli v1.7.6 generated Node.js "deploy graph
# integrity" template (agentwatch-monitor has no deploy graph and no Node
# dependency — this is a pure-Python CLI package, per pyproject.toml).
# Runs the install + lint + test gate on every push and pull request.

name: verify-deploy

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel stale runs on the same ref/PR so only the latest commit's
# verify-deploy run consumes CI minutes and gates merges.
concurrency:
  group: verify-deploy-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: verify-deploy only reads repo contents.
permissions:
  contents: read

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: pip install -e ".[dev,siem,llm]"
      - name: Lint with ruff
        run: ruff check .
      - name: Run tests
        run: python -m pytest tests/
